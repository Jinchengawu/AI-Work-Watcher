[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-work-watcher"
version = "0.2.0a1"
description = "Local-first AI workflow coach and prompt management for personal developers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "Jinchengawu" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance"
]

[project.urls]
Homepage = "https://github.com/Jinchengawu/AI-Work-Watcher"
Issues = "https://github.com/Jinchengawu/AI-Work-Watcher/issues"

[project.scripts]
ai-work-watcher = "ai_work_watcher.cli:main"

[tool.setuptools.packages.find]
include = ["ai_work_watcher*"]

[tool.setuptools.package-data]
ai_work_watcher = ["skill/SKILL.md", "skill/agents/openai.yaml"]
